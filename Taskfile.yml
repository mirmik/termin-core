version: '3'

silent: true

tasks:
  default:
    desc: Show the repository command menu
    cmds:
      - task --list

  build:
    desc: Build the complete host SDK
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/build/sdk.ps1 {{.CLI_ARGS}}{{else}}./scripts/build/sdk.sh {{.CLI_ARGS}}{{end}}'

  test:
    desc: Build and verify the complete repository
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/test/all.ps1 {{.CLI_ARGS}}{{else}}./scripts/test/all.sh {{.CLI_ARGS}}{{end}}'

  smoke:
    desc: Verify installed and relocated SDK consumption
    deps:
      - smoke:installed
      - smoke:relocated

  smoke:installed:
    desc: Verify consumption through the installed SDK boundary
    cmds:
      - '{{if eq OS "windows"}}./sdk/bin/termin_python.exe -I scripts/smoke-installed-core-consumers --sdk-root sdk{{else}}./sdk/bin/termin_python -I scripts/smoke-installed-core-consumers --sdk-root sdk{{end}}'

  smoke:relocated:
    desc: Verify the SDK after relocation
    cmds:
      - '{{if eq OS "windows"}}./sdk/bin/termin_python.exe -m termin_build.relocated_sdk_smoke --sdk-root sdk{{else}}./sdk/bin/termin_python -m termin_build.relocated_sdk_smoke --sdk-root sdk{{end}}'

  build:android:
    desc: Build the native Android SDK
    platforms: [linux]
    cmds:
      - ./scripts/build/android.sh {{.CLI_ARGS}}

  build:web:
    desc: Ensure Emscripten and build the native Web SDK
    platforms: [linux]
    cmds:
      - ./scripts/build/web.sh {{.CLI_ARGS}}

  docs:build:
    desc: Build the documentation site strictly
    cmds:
      - '{{if eq OS "windows"}}python -m mkdocs build --strict{{else}}python3 -m mkdocs build --strict{{end}}'

  docs:serve:
    desc: Serve the documentation with live reload
    cmds:
      - '{{if eq OS "windows"}}python -m mkdocs serve{{else}}python3 -m mkdocs serve{{end}}'
